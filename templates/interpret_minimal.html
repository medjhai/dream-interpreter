{% extends "base_minimal.html" %}

{% block content %}
<div class="container-sm">
    <div class="text-center mb-4">
        <h1>✨ Interpret Your Dream</h1>
        <p class="text-muted">Tell us your dream and discover its meaning</p>
    </div>

    <form id="dreamForm" class="card">
        <div class="form-group">
            <label class="form-label">Dream title</label>
            <input type="text" class="form-input" id="title" placeholder="A title for your dream..." required>
        </div>

        <div class="form-group">
            <label class="form-label">Tell us your dream</label>
            <textarea class="form-textarea" id="content" placeholder="Describe your dream in detail..." style="min-height: 150px;" required></textarea>
        </div>

        <div class="text-center">
            <button type="button" id="continueBtn" class="btn btn-primary btn-lg" style="margin: 0 auto;">
                Continue
            </button>
        </div>
    </form>
</div>

<!-- Mood & Style Selection Modal -->
<div id="dreamModal" class="voice-modal hidden">
    <div class="voice-modal-content" style="max-width: 500px;">
        <div class="voice-modal-header">
            <h3>🎭 Customize Interpretation</h3>
            <button class="voice-modal-close" onclick="closeDreamModal()">×</button>
        </div>
        <div class="voice-modal-body">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">How did you feel in the dream?</label>
                <select id="dreamMood" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);">
                    <option value="neutro">😐 Neutral</option>
                    <option value="felice">😊 Happy</option>
                    <option value="triste">😢 Sad</option>
                    <option value="ansioso">😰 Anxious</option>
                    <option value="rabbioso">😠 Angry</option>
                    <option value="confuso">😕 Confused</option>
                </select>
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Interpretation style:</label>
                <select id="dreamStyle" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);">
                    <option value="psicologico">🔍 Psychological</option>
                    <option value="spirituale">🕉️ Spiritual</option>
                    <option value="neutro">📖 Neutral</option>
                </select>
            </div>
            
            <div style="text-align: center;">
                <button onclick="submitTextDream()" style="background: var(--primary); color: white; border: none; padding: 0.75rem 2rem; border-radius: var(--radius); font-size: 1rem; cursor: pointer; margin-right: 1rem;">
                    🔮 Interpret Dream
                </button>
                <button onclick="closeDreamModal()" style="background: var(--surface-light); color: var(--text); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: var(--radius); font-size: 1rem; cursor: pointer;">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Step-by-step dream interpretation flow
document.getElementById('continueBtn').addEventListener('click', function() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    
    if (!title || !content) {
        alert('Please fill in both title and dream content.');
        return;
    }
    
    // Show mood and style selection modal
    document.getElementById('dreamModal').classList.remove('hidden');
});

function closeDreamModal() {
    document.getElementById('dreamModal').classList.add('hidden');
}

function submitTextDream() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const mood = document.getElementById('dreamMood').value;
    const style = document.getElementById('dreamStyle').value;
    
    closeDreamModal();
    
    // Show loading state
    const loadingDiv = document.createElement('div');
    loadingDiv.innerHTML = `
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                   background: rgba(0,0,0,0.8); z-index: 9999; display: flex; 
                   align-items: center; justify-content: center; color: white;">
            <div style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: 1rem;">🔮</div>
                <div>Interpreting your dream...</div>
            </div>
        </div>
    `;
    document.body.appendChild(loadingDiv);
    
    // Create form and submit
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = '{{ url_for("interpret") }}';
    
    const titleInput = document.createElement('input');
    titleInput.type = 'hidden';
    titleInput.name = 'title';
    titleInput.value = title;
    
    const contentInput = document.createElement('input');
    contentInput.type = 'hidden';
    contentInput.name = 'content';
    contentInput.value = content;
    
    const moodInput = document.createElement('input');
    moodInput.type = 'hidden';
    moodInput.name = 'mood';
    moodInput.value = mood;
    
    const styleInput = document.createElement('input');
    styleInput.type = 'hidden';
    styleInput.name = 'style';
    styleInput.value = style;
    
    form.appendChild(titleInput);
    form.appendChild(contentInput);
    form.appendChild(moodInput);
    form.appendChild(styleInput);
    
    document.body.appendChild(form);
    form.submit();
}

// Close modal when clicking outside
document.getElementById('dreamModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeDreamModal();
    }
});
</script>
{% endblock %}
