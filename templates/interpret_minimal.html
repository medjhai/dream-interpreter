<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Interpreta Sogno - Dream Interpreter</title>
    <meta name="theme-color" content="#000000">
</head>
<body style="margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

<div class="page-container">
    {% set welcome_text = "Interpret Dream" %}
    {% include 'unified_header.html' %}

    <div class="main-content">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="page-title">✨ Interpreta il Tuo Sogno</h1>
            <p class="page-subtitle">Racconta il tuo sogno e scopri il suo significato</p>
        </div>

        <!-- Dream Form -->
        <form id="dreamForm" class="dream-form">
            <div class="form-group">
                <label class="form-label">✨ Titolo del sogno</label>
                <input type="text" class="form-input" id="title" placeholder="Come vuoi chiamare questo sogno?" required>
            </div>

            <div class="form-group">
                <label class="form-label">💭 Racconta il tuo sogno</label>
                <textarea class="form-textarea" id="content" placeholder="Prenditi il tempo... descrivi ogni dettaglio che ricordi" required></textarea>
            </div>

            <div class="form-actions">
                <button type="button" id="continueBtn" class="primary-button">
                    🔮 Continua con l'Interpretazione
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Mood & Style Selection Modal -->
<div id="dreamModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h3 class="modal-title">🌙 Impostazioni Sogno</h3>
            <p class="modal-subtitle">Personalizza la tua esperienza di interpretazione</p>
            <button class="modal-close" onclick="closeDreamModal()">×</button>
        </div>
        
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">🎭 Come ti sei sentito nel sogno?</label>
                <select id="dreamMood" class="form-select">
                    <option value="neutro">😐 Neutro</option>
                    <option value="felice">😊 Felice</option>
                    <option value="triste">😢 Triste</option>
                    <option value="spaventato">😨 Spaventato</option>
                    <option value="eccitato">🤩 Eccitato</option>
                    <option value="confuso">😵‍💫 Confuso</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">✨ Stile di interpretazione</label>
                <select id="dreamStyle" class="form-select">
                    <option value="psicologico">🧠 Psicologico</option>
                    <option value="spirituale">🔮 Spirituale</option>
                    <option value="neutro">⚖️ Neutro</option>
                </select>
            </div>
        </div>
        
        <div class="modal-actions">
            <button onclick="submitDream()" class="primary-button">
                🔮 Interpreta Sogno
            </button>
            <button onclick="closeDreamModal()" class="secondary-button">
                Annulla
            </button>
        </div>
    </div>
</div>

<style>
/* Base Styles */
body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.page-container {
    background: #000;
    min-height: 100vh;
    width: 100%;
    max-width: 100%;
    margin: 0;
    position: relative;
    color: white;
}

.main-content {
    padding: 20px 24px 40px;
}

/* Typography */
.page-title {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px;
    color: white;
}

.page-subtitle {
    font-size: 16px;
    color: #888;
    margin: 0 0 30px;
}

/* Dream Form */
.dream-form {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
}

.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    font-size: 16px;
    font-weight: 500;
    color: white;
    margin-bottom: 8px;
}

.form-input,
.form-textarea,
.form-select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 16px;
    color: white;
    font-size: 16px;
    font-family: inherit;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
    outline: none;
    border-color: #007AFF;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.form-textarea {
    resize: vertical;
    min-height: 120px;
    line-height: 1.5;
}

.form-textarea::placeholder,
.form-input::placeholder {
    color: #666;
}

.form-actions {
    text-align: center;
    margin-top: 32px;
}

.primary-button {
    background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
    color: white;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    display: inline-block;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
}

.primary-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
    text-decoration: none;
    color: white;
}

.primary-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.secondary-button {
    background: rgba(255,255,255,0.1);
    color: white;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    display: inline-block;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
}

.secondary-button:hover {
    background: rgba(255,255,255,0.15);
    text-decoration: none;
    color: white;
}

/* Modal */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    padding: 20px;
}

.modal-overlay.hidden {
    display: none;
}

.modal-card {
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    position: relative;
}

.modal-header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
}

.modal-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    color: white;
}

.modal-subtitle {
    font-size: 14px;
    color: #888;
    margin: 0;
}

.modal-close {
    position: absolute;
    top: -4px;
    right: -4px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.modal-close:hover {
    background: rgba(255,255,255,0.2);
}

.modal-body {
    margin-bottom: 24px;
}

.modal-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* Responsive */
@media (max-width: 375px) {
    .main-content {
        padding: 20px 16px 40px;
    }
    
    .dream-form {
        padding: 20px;
    }
    
    .form-input,
    .form-textarea,
    .form-select {
        padding: 14px;
        font-size: 15px;
    }
}

/* Desktop View */
@media (min-width: 768px) {
    .page-container {
        max-width: 414px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }
}
</style>

<script>
// Show mood and style selection modal
document.getElementById('continueBtn').addEventListener('click', function() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    
    if (!title || !content) {
        alert('Per favore, compila tutti i campi richiesti.');
        return;
    }
    
    if (content.length < 10) {
        alert('Per favore, descrivi il tuo sogno in modo più dettagliato.');
        return;
    }
    
    document.getElementById('dreamModal').classList.remove('hidden');
});

function closeDreamModal() {
    document.getElementById('dreamModal').classList.add('hidden');
}

function submitDream() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const mood = document.getElementById('dreamMood').value;
    const style = document.getElementById('dreamStyle').value;
    
    if (!title || !content) {
        alert('Per favore, compila tutti i campi richiesti.');
        return;
    }
    
    // Disable submit button
    const submitBtn = document.querySelector('#dreamModal .primary-button');
    submitBtn.disabled = true;
    submitBtn.textContent = '🔮 Interpretando...';
    
    // Submit form data
    fetch('/interpret', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            title: title,
            content: content,
            mood: mood,
            interpretation_style: style
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Redirect to dream view
            window.location.href = `/dream/${data.dream_id}`;
        } else {
            alert('Errore durante l\'interpretazione: ' + (data.error || 'Errore sconosciuto'));
            submitBtn.disabled = false;
            submitBtn.textContent = '🔮 Interpreta Sogno';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Errore di connessione. Riprova.');
        submitBtn.disabled = false;
        submitBtn.textContent = '🔮 Interpreta Sogno';
    });
}

// Auto-resize textarea
document.getElementById('content').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 300) + 'px';
});

// Close modal when clicking outside
document.getElementById('dreamModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeDreamModal();
    }
});

// Close modal with Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDreamModal();
    }
});
</script>

</body>
</html>
