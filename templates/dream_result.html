{% extends "base_minimal.html" %}

{% block content %}
<div class="container-sm">
    <!-- Back Navigation -->
    <div class="mb-3">
        <a href="/" class="btn btn-secondary btn-sm">
            ← Back to Home
        </a>
    </div>

    <!-- Dream Result Card -->
    <div class="card" style="background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 2rem;">
        <div class="card-header" style="border: none; background: transparent; padding: 0 0 1.5rem 0;">
            <h1 style="color: var(--text); margin: 0; font-size: 1.8rem; font-weight: 600;">{{ dream_title }}</h1>
            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 1rem;">
                <span style="background: rgba(102, 126, 234, 0.2); color: rgba(102, 126, 234, 1); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem;">
                    {{ mood_display }}
                </span>
                <span style="background: rgba(118, 75, 162, 0.2); color: rgba(118, 75, 162, 1); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem;">
                    {{ style_display }}
                </span>
                <small style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">Just interpreted</small>
            </div>
        </div>

        <!-- Dream Content -->
        <div style="margin-bottom: 2rem;">
            <h3 style="color: rgba(255,255,255,0.9); margin: 0 0 1rem 0; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>🌙</span> Your Dream
            </h3>
            <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px; border-left: 4px solid rgba(102, 126, 234, 0.6); line-height: 1.7; color: rgba(255,255,255,0.9);">
                {{ dream_content|nl2br|safe }}
            </div>
        </div>

        <!-- Interpretation -->
        <div style="margin-bottom: 2rem;">
            <h3 style="color: rgba(255,255,255,0.9); margin: 0 0 1rem 0; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>🔮</span> Interpretation
            </h3>
            <div style="background: rgba(102, 126, 234, 0.1); padding: 1.5rem; border-radius: 12px; border-left: 4px solid rgba(118, 75, 162, 0.6); line-height: 1.8; color: rgba(255,255,255,0.95);">
                {{ dream_interpretation|nl2br|safe }}
            </div>
        </div>

        <!-- Actions -->
        <div style="text-align: center; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
            <a href="/" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                           color: white; text-decoration: none; padding: 1rem 2rem; 
                           border-radius: 12px; font-weight: 600; display: inline-block;
                           transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);">
                ✨ Interpret Another Dream
            </a>
        </div>
    </div>
</div>

<style>
.container-sm {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1rem;
}

.btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.9);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s ease;
}

.btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
    color: white;
    text-decoration: none;
}

.btn-secondary {
    font-size: 0.9rem;
}

@media (max-width: 768px) {
    .container-sm {
        padding: 1rem 0.5rem;
    }
    
    .card {
        padding: 1.5rem !important;
    }
}
</style>
{% endblock %}
