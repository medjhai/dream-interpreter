{% extends "base.html" %}

{% block title %}Registrazione - Interprete dei Sogni{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <div class="auth-logo">
                            <i class="fas fa-moon"></i>
                        </div>
                        <h2 class="auth-title">Crea Account</h2>
                        <p class="auth-subtitle">Inizia il tuo viaggio nei sogni</p>
                    </div>
                    
                    <form id="registerForm" class="auth-form">
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       required 
                                       placeholder="Scegli un username">
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       name="email" 
                                       required 
                                       placeholder="La tua email">
                            </div>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       required 
                                       placeholder="Minimo 6 caratteri">
                            </div>
                            <div class="form-text">
                                <small>La password deve essere di almeno 6 caratteri</small>
                            </div>
                        </div>
                        
                        <div id="error-message" class="alert alert-danger d-none" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="error-text"></span>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-auth" id="registerBtn">
                                <span class="btn-text">
                                    <i class="fas fa-user-plus me-2"></i>Registrati
                                </span>
                                <span class="btn-loading d-none">
                                    <span class="spinner-border spinner-border-sm me-2"></span>
                                    Registrazione in corso...
                                </span>
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <p class="auth-switch">
                                Hai già un account? 
                                <a href="{{ url_for('login') }}" class="auth-link">Accedi</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const registerBtn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    
    if (!username || !email || !password) {
        showError('Tutti i campi sono richiesti');
        return;
    }
    
    if (password.length < 6) {
        showError('La password deve essere di almeno 6 caratteri');
        return;
    }
    
    // Show loading state
    showLoading(true);
    hideError();
    
    fetch('/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            username: username,
            email: email,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        showLoading(false);
        
        if (data.success) {
            window.location.href = data.redirect;
        } else {
            showError(data.error || 'Errore durante la registrazione');
        }
    })
    .catch(error => {
        showLoading(false);
        showError('Errore di comunicazione con il server');
        console.error('Error:', error);
    });
    
    function showLoading(loading) {
        const btnText = registerBtn.querySelector('.btn-text');
        const btnLoading = registerBtn.querySelector('.btn-loading');
        
        if (loading) {
            btnText.classList.add('d-none');
            btnLoading.classList.remove('d-none');
            registerBtn.disabled = true;
        } else {
            btnText.classList.remove('d-none');
            btnLoading.classList.add('d-none');
            registerBtn.disabled = false;
        }
    }
    
    function showError(message) {
        errorText.textContent = message;
        errorDiv.classList.remove('d-none');
    }
    
    function hideError() {
        errorDiv.classList.add('d-none');
    }
});
</script>
{% endblock %}
