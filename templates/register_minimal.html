<!DOCTYPE html>
<html lang="it" style="margin: 0; padding: 0; background: #000; width: 100%; height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Registrati - Dream Interpreter</title>
    <meta name="theme-color" content="#000000">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow-x: hidden; }
    </style>
</head>
<body style="margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 100vw; min-height: 100vh; overflow-x: hidden;">

<div class="page-container">
    <div class="main-content">
        <!-- Header -->
        <div class="auth-header">
            <h1 class="auth-title">🌙 Dream Interpreter</h1>
            <p class="auth-subtitle">Crea il tuo account gratuito</p>
        </div>

        <!-- Register Form -->
        <div class="auth-form-section">
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Nome Utente</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                    <div class="form-hint">Almeno 6 caratteri</div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="primary-button" id="registerBtn">
                        ✨ Registrati
                    </button>
                </div>
                
                <div id="registerError" class="error-message hidden"></div>
            </form>
        </div>

        <!-- Switch to Login -->
        <div class="auth-switch">
            <p>Hai già un account?</p>
            <a href="{{ url_for('login') }}" class="switch-link">
                Accedi qui
            </a>
        </div>
    </div>
</div>

<style>
/* Base Styles */
body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.page-container {
    background: #000;
    min-height: 100vh;
    width: 100vw;
    max-width: 100vw;
    margin: 0;
    padding: 20px;
    position: relative;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

.main-content {
    width: 100%;
    max-width: 400px;
}

/* Auth Header */
.auth-header {
    text-align: center;
    margin-bottom: 40px;
}

.auth-title {
    font-size: 36px;
    font-weight: 700;
    margin: 0 0 8px;
    color: white;
}

.auth-subtitle {
    font-size: 16px;
    color: #888;
    margin: 0;
}

/* Auth Form */
.auth-form-section {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 24px;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-label {
    font-size: 14px;
    font-weight: 500;
    color: white;
}

.form-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 16px;
    color: white;
    font-size: 16px;
    font-family: inherit;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.form-input:focus {
    outline: none;
    border-color: #007AFF;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.form-input::placeholder {
    color: #666;
}

.form-hint {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
}

.form-actions {
    margin-top: 8px;
}

.primary-button {
    background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
    color: white;
    text-decoration: none;
    padding: 18px 32px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    display: block;
    text-align: center;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
}

.primary-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
    text-decoration: none;
    color: white;
}

.primary-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

/* Error Message */
.error-message {
    background: rgba(255, 59, 48, 0.1);
    border: 1px solid rgba(255, 59, 48, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: #FF3B30;
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
}

.error-message.hidden {
    display: none;
}

/* Success Message */
.success-message {
    background: rgba(52, 199, 89, 0.1);
    border: 1px solid rgba(52, 199, 89, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: #34C759;
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
}

/* Auth Switch */
.auth-switch {
    text-align: center;
    padding: 20px;
}

.auth-switch p {
    color: #888;
    margin: 0 0 12px;
    font-size: 14px;
}

.switch-link {
    background: rgba(255,255,255,0.05);
    color: #007AFF;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 500;
    display: inline-block;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 122, 255, 0.2);
}

.switch-link:hover {
    background: rgba(0, 122, 255, 0.1);
    text-decoration: none;
    color: #007AFF;
}

/* Responsive Design */
@media (max-width: 375px) {
    .page-container {
        padding: 16px;
    }
    
    .auth-form-section {
        padding: 24px;
    }
    
    .auth-title {
        font-size: 32px;
    }
}

@media (min-width: 376px) and (max-width: 768px) {
    .page-container {
        padding: 32px;
    }
}

@media (min-width: 769px) {
    .page-container {
        max-width: 100vw;
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
    }
    
    .main-content {
        max-width: 420px;
    }
}

@media (min-width: 1024px) {
    .main-content {
        max-width: 480px;
    }
}
</style>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('registerError');
    
    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.textContent = '✨ Registrando...';
    
    // Hide previous error
    errorDiv.classList.add('hidden');
    
    const formData = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };
    
    // Client-side validation
    if (!formData.username || !formData.email || !formData.password) {
        errorDiv.textContent = 'Tutti i campi sono richiesti';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Registrati';
        return;
    }
    
    if (formData.password.length < 6) {
        errorDiv.textContent = 'La password deve essere di almeno 6 caratteri';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Registrati';
        return;
    }
    
    if (!isValidEmail(formData.email)) {
        errorDiv.textContent = 'Inserisci un indirizzo email valido';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Registrati';
        return;
    }
    
    try {
        const response = await fetch('/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (result.success) {
            submitBtn.textContent = '🎉 Registrazione completata!';
            setTimeout(() => {
                window.location.href = result.redirect;
            }, 500);
        } else {
            errorDiv.textContent = result.error || 'Errore durante la registrazione';
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = '✨ Registrati';
        }
    } catch (error) {
        console.error('Registration error:', error);
        errorDiv.textContent = 'Errore di connessione. Riprova.';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Registrati';
    }
});

// Email validation helper
function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
}

// Real-time password validation
document.getElementById('password').addEventListener('input', function() {
    const password = this.value;
    const hint = this.nextElementSibling;
    
    if (password.length === 0) {
        hint.textContent = 'Almeno 6 caratteri';
        hint.style.color = '#666';
    } else if (password.length < 6) {
        hint.textContent = `${6 - password.length} caratteri rimanenti`;
        hint.style.color = '#FF3B30';
    } else {
        hint.textContent = '✓ Password valida';
        hint.style.color = '#34C759';
    }
});

// Auto-focus first input
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('username').focus();
});
</script>

</body>
</html>
