<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Dream Interpreter</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Interpreta i tuoi sogni con analisi psicologica avanzata">
</head>
<body style="margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <div class="mobile-app">
        <!-- Header -->
        <div class="app-header">
            <a href="{{ url_for('profile') }}" class="user-profile">
                <div class="avatar">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ddd'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='40' fill='%23666'%3E{{ current_user.username[0].upper() if current_user.is_authenticated else 'G' }}%3C/text%3E%3C/svg%3E" alt="Avatar">
                </div>
                <div class="greeting-text">
                    <div class="hello">Hello {{ current_user.username if current_user.is_authenticated else 'Guest' }}</div>
                    <div class="welcome">Welcome back.</div>
                </div>
            </a>
            <button class="menu-dots" onclick="toggleHomeNav()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="slide-nav" id="homeNav">
            <button class="nav-close" onclick="toggleHomeNav()">×</button>
            <a href="{{ url_for('settings') }}" class="nav-item">⚙️ Settings</a>
            <a href="{{ url_for('faq') }}" class="nav-item">❓ FAQ</a>
            <a href="{{ url_for('contacts') }}" class="nav-item">📧 Contacts</a>
            <a href="{{ url_for('profile') }}" class="nav-item">👤 Profile</a>
        </nav>

        <!-- Main Content -->
        <div class="main-section">
            <!-- Main Title -->
            <h1 class="dream-title">
                What did<br>
                you <span class="dream-gray">dream</span><br>
                about..
            </h1>

            <!-- Fluid Waves -->
            <div class="wave-container">
                <svg class="wave-svg" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path class="wave-path wave1" d="M0,100 C50,120 100,80 150,100 C200,120 250,80 300,100 C350,120 400,80 450,100 L450,150 L0,150 Z" fill="url(#waveGrad1)" opacity="0.7"/>
                    <path class="wave-path wave2" d="M0,120 C50,100 100,140 150,120 C200,100 250,140 300,120 C350,100 400,140 450,120 L450,170 L0,170 Z" fill="url(#waveGrad2)" opacity="0.5"/>
                </svg>
            </div>

            <!-- Integrated Dream Input Form -->
            <div class="dream-input-section">
                <h3 class="form-title">Write about your dream here!</h3>
                
                <div class="input-container">
                    <!-- Mood Selector -->
                    <div class="mood-selector">
                        <select id="moodSelect" class="mood-dropdown">
                            <option value="felice">😊</option>
                            <option value="triste">😢</option>
                            <option value="spaventato">😨</option>
                            <option value="eccitato">🤩</option>
                            <option value="confuso">😵‍💫</option>
                            <option value="neutro" selected>😐</option>
                        </select>
                    </div>

                    <!-- Text Input -->
                    <div class="text-input-wrapper">
                        <textarea 
                            id="dreamTextInput" 
                            placeholder="I dreamt I was in Old trafford playing with Alozie and 11 others players with everyone wearing pink and yellow tshirt, I scored and everyone is cheering me up while I jubilate..."
                            class="dream-textarea"
                        ></textarea>
                        <button onclick="interpretTextDream()" class="send-button">
                            <div class="send-icon">➤</div>
                        </button>
                    </div>
                </div>

                <!-- Voice Button -->
                <button class="voice-button" onclick="toggleVoiceRecording()">
                    Use voice
                </button>
            </div>
        </div>
    </div>

    <style>
    /* Mobile App Container */
    .mobile-app {
        background: #000000;
        min-height: 100vh;
        max-width: 375px;
        margin: 0 auto;
        position: relative;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow-x: hidden;
    }

    /* App Header */
    .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 24px 20px;
    }

    .user-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s ease;
    }

    .user-profile:hover {
        text-decoration: none;
        color: inherit;
        transform: scale(1.02);
    }

    .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .greeting-text .hello {
        font-size: 16px;
        color: #888;
        margin-bottom: 2px;
    }

    .greeting-text .welcome {
        font-size: 17px;
        color: #ffffff;
        font-weight: 500;
    }

    .menu-dots {
        background: none;
        border: none;
        width: 24px;
        height: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
    }

    .menu-dots span {
        width: 4px;
        height: 4px;
        background: #888;
        border-radius: 50%;
    }

    /* Navigation */
    .slide-nav {
        position: fixed;
        top: 0;
        right: -300px;
        width: 280px;
        height: 100vh;
        background: rgba(20, 20, 20, 0.95);
        backdrop-filter: blur(20px);
        transition: right 0.3s ease;
        z-index: 1000;
        padding: 60px 20px;
    }

    .slide-nav.active {
        right: 0;
    }

    .nav-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

    .nav-item {
        display: block;
        color: white;
        text-decoration: none;
        padding: 16px 0;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-item:hover {
        color: #007AFF;
        text-decoration: none;
    }

    /* Main Section */
    .main-section {
        padding: 0 24px 40px;
    }

    /* Dream Title */
    .dream-title {
        font-size: 48px;
        font-weight: 700;
        line-height: 1.1;
        margin: 20px 0 30px;
        color: white;
    }

    .dream-gray {
        color: #666;
    }

    /* Wave Container */
    .wave-container {
        margin: 20px -24px 30px;
        height: 100px;
        overflow: hidden;
    }

    .wave-svg {
        width: 100%;
        height: 100%;
    }

    .wave-path {
        animation: waveFlow 4s ease-in-out infinite;
    }

    .wave1 {
        animation-delay: 0s;
    }

    .wave2 {
        animation-delay: -2s;
    }

    @keyframes waveFlow {
        0%, 100% { 
            transform: translateX(-10px) scaleY(0.9); 
        }
        50% { 
            transform: translateX(10px) scaleY(1.1); 
        }
    }

    /* Dream Input Section */
    .dream-input-section {
        margin-top: 30px;
    }

    .form-title {
        font-size: 16px;
        color: #888;
        margin-bottom: 16px;
        font-weight: 400;
    }

    .input-container {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 20px;
    }

    /* Mood Selector */
    .mood-selector {
        flex-shrink: 0;
    }

    .mood-dropdown {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        color: white;
        font-size: 24px;
        padding: 12px 8px;
        cursor: pointer;
        outline: none;
        width: 60px;
        height: 60px;
        text-align: center;
    }

    .mood-dropdown:focus {
        border-color: #007AFF;
        background: rgba(255,255,255,0.15);
    }

    /* Text Input Wrapper */
    .text-input-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        align-items: flex-end;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 25px;
        padding: 16px 60px 16px 20px;
        min-height: 60px;
    }

    .text-input-wrapper:focus-within {
        border-color: #007AFF;
        background: rgba(255,255,255,0.1);
    }

    .dream-textarea {
        background: none;
        border: none;
        color: white;
        font-size: 16px;
        resize: none;
        outline: none;
        width: 100%;
        min-height: 28px;
        max-height: 120px;
        line-height: 1.4;
        font-family: inherit;
    }

    .dream-textarea::placeholder {
        color: #666;
    }

    .send-button {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .send-button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }

    .send-icon {
        color: white;
        font-size: 18px;
        font-weight: bold;
    }

    /* Voice Button */
    .voice-button {
        background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
        border: none;
        border-radius: 25px;
        padding: 12px 32px;
        color: #000;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: block;
        margin: 0 auto;
        transition: all 0.3s ease;
    }

    .voice-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
    }

    /* Responsive */
    @media (max-width: 375px) {
        .mobile-app {
            max-width: 100%;
        }
        
        .dream-title {
            font-size: 40px;
        }
    }

    @media (min-width: 376px) {
        .mobile-app {
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
    }
    </style>

    <script>
        // Navigation toggle
        function toggleHomeNav() {
            const nav = document.getElementById('homeNav');
            nav.classList.toggle('active');
        }

        // Close navigation when clicking outside
        document.addEventListener('click', function(event) {
            const nav = document.getElementById('homeNav');
            const menuBtn = document.querySelector('.menu-dots');
            
            if (!nav.contains(event.target) && !menuBtn.contains(event.target)) {
                nav.classList.remove('active');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('homeNav').classList.remove('active');
            }
        });
        
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        
        // Voice recording functionality
        function toggleVoiceRecording() {
            if (!isRecording) {
                // Start recording
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            isRecording = true;
                            
                            mediaRecorder = new MediaRecorder(stream);
                            audioChunks = [];
                            
                            mediaRecorder.ondataavailable = event => {
                                audioChunks.push(event.data);
                            };
                            
                            mediaRecorder.onstop = () => {
                                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                                console.log('Audio recorded:', audioBlob);
                                
                                // Stop all tracks
                                stream.getTracks().forEach(track => track.stop());
                                
                                // Here you would process the audio or send to server
                                alert('Voice recording completed! Feature coming soon.');
                            };
                            
                            mediaRecorder.start();
                        })
                        .catch(err => {
                            console.error('Error accessing microphone:', err);
                            alert('Could not access microphone. Please check permissions.');
                        });
                } else {
                    // Fallback for browsers without getUserMedia
                    fallbackVoiceRecording();
                }
            } else {
                // Stop recording
                isRecording = false;
                
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            }
        }
        
        // Fallback voice recording simulation
        function fallbackVoiceRecording() {
            isRecording = true;
            
            // Simulate recording for 3 seconds
            setTimeout(() => {
                isRecording = false;
                alert('Voice recording completed! (Demo mode)');
            }, 3000);
        }

        // Auto-resize textarea
        document.getElementById('dreamTextInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Dream interpretation
        function interpretTextDream() {
            const dreamText = document.getElementById('dreamTextInput').value.trim();
            const selectedMood = document.getElementById('moodSelect').value;
            
            if (!dreamText) {
                alert('Please write your dream first!');
                return;
            }
            
            // Create form and submit
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '{{ url_for("interpret") }}';
            
            const titleInput = document.createElement('input');
            titleInput.type = 'hidden';
            titleInput.name = 'title';
            titleInput.value = `Dream - ${new Date().toLocaleDateString()}`;
            
            const contentInput = document.createElement('input');
            contentInput.type = 'hidden';
            contentInput.name = 'content';
            contentInput.value = dreamText;
            
            const moodInput = document.createElement('input');
            moodInput.type = 'hidden';
            moodInput.name = 'mood';
            moodInput.value = selectedMood;
            
            const styleInput = document.createElement('input');
            styleInput.type = 'hidden';
            styleInput.name = 'style';
            styleInput.value = 'psicologico'; // Default style (hidden as requested)
            
            form.appendChild(titleInput);
            form.appendChild(contentInput);
            form.appendChild(moodInput);
            form.appendChild(styleInput);
            
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
