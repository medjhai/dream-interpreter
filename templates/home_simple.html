{% extends "base_minimal.html" %}

{% block content %}
    <!-- User Greeting -->
    <div class="user-greeting">
        <a href="{{ url_for('profile') }}" class="greeting-link">
            Ciao, {{ current_user.username if current_user.is_authenticated else 'Guest' }}
        </a>
    </div>

    <!-- Home Navigation Toggle -->
    <button class="home-menu-toggle" onclick="toggleHomeNav()" aria-label="Menu">
        ☰
    </button>
    
    <!-- Full Screen Navigation -->
    <nav class="home-nav" id="homeNav">
        <button class="home-nav-close" onclick="toggleHomeNav()" aria-label="Chiudi menu">
            ×
        </button>
        <a href="{{ url_for('settings') }}" class="home-nav-link">⚙️ Settings</a>
        <a href="{{ url_for('faq') }}" class="home-nav-link">❓ FAQ</a>
        <a href="{{ url_for('contacts') }}" class="home-nav-link">📧 Contacts</a>
    </nav>

    <!-- Main Content -->
    <div class="simple-home">
        <div class="center-content">
            <!-- Main Title -->
            <h1 class="main-title">What did you dream about..</h1>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <button onclick="showTextInput()" class="action-btn write-btn">
                    ✍️ Write
                </button>
                
                <button onclick="toggleVoiceRecording()" id="voiceBtn" class="action-btn voice-btn">
                    <span class="voice-icon">🎤</span>
                    <span class="voice-text">Record</span>
                </button>
            </div>
            
            <!-- Text Input (Initially Hidden) -->
            <div class="text-input-area" id="textInputArea" style="display: none;">
                <textarea id="dreamTextInput" placeholder="Tell me about your dream..." 
                        style="width: 100%; min-height: 150px; padding: 1.5rem; 
                               background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
                               border-radius: 16px; color: var(--text); resize: vertical; 
                               font-size: 1.1rem; line-height: 1.6; margin-bottom: 1rem;"></textarea>
                <button onclick="interpretTextDream()" class="submit-btn">
                    Interpret Dream ➤
                </button>
            </div>
        </div>
    </div>

    <style>
    /* Simple Home Layout */
    .simple-home {
        min-height: 100vh;
        background: linear-gradient(135deg, 
            rgba(13, 17, 29, 1) 0%, 
            rgba(28, 34, 52, 1) 50%, 
            rgba(13, 17, 29, 1) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }
    
    .center-content {
        text-align: center;
        max-width: 500px;
        width: 100%;
    }
    
    /* User Greeting */
    .user-greeting {
        position: fixed;
        top: 2rem;
        left: 2rem;
        z-index: 100;
    }
    
    .greeting-link {
        color: rgba(255,255,255,0.9);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        transition: color 0.3s ease;
    }
    
    .greeting-link:hover {
        color: rgba(102, 126, 234, 1);
        text-decoration: none;
    }
    
    /* Main Title */
    .main-title {
        color: rgba(255,255,255,0.95);
        font-size: 3rem;
        font-weight: 300;
        margin: 0 0 3rem 0;
        line-height: 1.2;
    }
    
    /* Action Buttons */
    .action-buttons {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-bottom: 2rem;
    }
    
    .action-btn {
        background: rgba(255,255,255,0.08);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 16px;
        padding: 1.5rem 3rem;
        color: rgba(255,255,255,0.95);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1.1rem;
        font-weight: 500;
        backdrop-filter: blur(10px);
        min-width: 120px;
    }
    
    .action-btn:hover {
        background: rgba(255,255,255,0.15);
        border-color: rgba(255,255,255,0.4);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    
    .write-btn:hover {
        border-color: rgba(102, 126, 234, 0.6);
        background: rgba(102, 126, 234, 0.1);
    }
    
    .voice-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .voice-btn:hover {
        border-color: rgba(220, 38, 38, 0.6);
        background: rgba(220, 38, 38, 0.1);
    }
    
    .voice-btn.recording {
        background: rgba(220, 38, 38, 0.2);
        border-color: rgba(220, 38, 38, 0.5);
        animation: pulse-record 1.5s infinite;
    }
    
    @keyframes pulse-record {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    /* Text Input Area */
    .text-input-area {
        animation: slideDown 0.3s ease;
        margin-top: 2rem;
    }
    
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .submit-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 1rem 2rem;
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    /* Navigation */
    .home-menu-toggle {
        position: fixed;
        top: 2rem;
        left: 2rem;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        color: rgba(255,255,255,0.9);
        padding: 0.75rem;
        cursor: pointer;
        font-size: 1.2rem;
        transition: all 0.3s ease;
        z-index: 90;
        margin-top: 3rem;
    }
    
    .home-menu-toggle:hover {
        background: rgba(255,255,255,0.15);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .main-title {
            font-size: 2.5rem;
        }
        
        .action-buttons {
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .action-btn {
            padding: 1.2rem 2rem;
            min-width: 200px;
        }
        
        .user-greeting {
            top: 1rem;
            left: 1rem;
        }
        
        .home-menu-toggle {
            top: 1rem;
            left: 1rem;
            margin-top: 2.5rem;
        }
        
        .simple-home {
            padding: 1rem;
        }
    }
    </style>

    <script>
        // Home navigation toggle
        function toggleHomeNav() {
            const nav = document.getElementById('homeNav');
            nav.classList.toggle('open');
        }

        // Close nav when clicking on a link
        document.querySelectorAll('.home-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('homeNav').classList.remove('open');
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                window.location.href = '{{ url_for("interpret") }}';
            }
            if (e.key === 'Escape') {
                document.getElementById('homeNav').classList.remove('open');
            }
        });
        
        // Simple Voice Recording System
        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';

        function toggleVoiceRecording() {
            if (isRecording) {
                stopVoiceRecording();
            } else {
                startVoiceRecording();
            }
        }

        function startVoiceRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Il tuo browser non supporta la registrazione vocale. Usa Chrome o Edge.');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'it-IT';
            
            recognition.onstart = function() {
                isRecording = true;
                updateVoiceButton(true);
            };
            
            recognition.onresult = function(event) {
                finalTranscript = '';
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    }
                }
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                stopVoiceRecording();
                alert('Errore nella registrazione vocale: ' + event.error);
            };
            
            recognition.onend = function() {
                stopVoiceRecording();
            };
            
            finalTranscript = '';
            recognition.start();
        }

        function stopVoiceRecording() {
            isRecording = false;
            if (recognition) {
                recognition.stop();
            }
            
            updateVoiceButton(false);
            
            if (finalTranscript.trim()) {
                document.getElementById('dreamTextInput').value = finalTranscript.trim();
            } else {
                alert('Nessun testo registrato. Riprova.');
            }
        }

        function updateVoiceButton(recording) {
            const btn = document.getElementById('voiceBtn');
            const icon = btn.querySelector('.voice-icon');
            const text = btn.querySelector('.voice-text');
            
            if (recording) {
                btn.classList.add('recording');
                icon.textContent = '🔴';
                text.textContent = 'Recording...';
            } else {
                btn.classList.remove('recording');
                icon.textContent = '🎤';
                text.textContent = 'Use voice';
            }
        }

        // Show text input area
        function showTextInput() {
            const textArea = document.getElementById('textInputArea');
            textArea.style.display = 'block';
            document.getElementById('dreamTextInput').focus();
        }
        
        // Simple text dream interpretation
        function interpretTextDream() {
            const dreamText = document.getElementById('dreamTextInput').value.trim();
            
            if (!dreamText) {
                alert('Please write your dream first!');
                return;
            }
            
            // Get user preferences or use defaults
            const mood = localStorage.getItem('preferredMood') || 'neutro';
            const style = localStorage.getItem('preferredStyle') || 'psicologico';
            
            // Create form and submit directly
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '{{ url_for("interpret") }}';
            
            const titleInput = document.createElement('input');
            titleInput.type = 'hidden';
            titleInput.name = 'title';
            titleInput.value = `Dream - ${new Date().toLocaleDateString()}`;
            
            const contentInput = document.createElement('input');
            contentInput.type = 'hidden';
            contentInput.name = 'content';
            contentInput.value = dreamText;
            
            const moodInput = document.createElement('input');
            moodInput.type = 'hidden';
            moodInput.name = 'mood';
            moodInput.value = mood;
            
            const styleInput = document.createElement('input');
            styleInput.type = 'hidden';
            styleInput.name = 'style';
            styleInput.value = style;
            
            form.appendChild(titleInput);
            form.appendChild(contentInput);
            form.appendChild(moodInput);
            form.appendChild(styleInput);
            
            document.body.appendChild(form);
            form.submit();
        }
    </script>
{% endblock %}
