<!DOCTYPE html>
<html lang="it" style="margin: 0; padding: 0; background: #000; width: 100%; height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dream Interpreter - Home</title>
    <meta name="theme-color" content="#000000">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow-x: hidden; }
    </style>
</head>
<body style="margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 100vw; height: 100vh; overflow-x: hidden;">

<div class="page-container">
    {% set welcome_text = "Welcome back." %}
    {% include 'unified_header.html' %}

    <div class="main-content">
        <!-- Main Title -->
        <div class="hero-section">
            <h1 class="hero-title">
                What did<br>
                you <span class="gradient-text">dream</span><br>
                about..
            </h1>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-card">
                <div class="input-header">
                    <p class="input-label">Write about your dream here!</p>
                </div>
                
                <!-- Text Input -->
                <div class="text-input-container">
                    <div class="mood-selector">
                        <button class="mood-button" data-mood="neutro" title="Neutro">😐</button>
                        <button class="mood-button" data-mood="felice" title="Felice">😊</button>
                        <button class="mood-button" data-mood="triste" title="Triste">😢</button>
                        <button class="mood-button" data-mood="spaventato" title="Spaventato">😨</button>
                        <button class="mood-button" data-mood="eccitato" title="Eccitato">🤩</button>
                        <button class="mood-button" data-mood="confuso" title="Confuso">😵‍💫</button>
                    </div>
                    
                    <textarea 
                        id="dreamInput" 
                        class="dream-input" 
                        placeholder="I dreamt I was in Old trafford playing with..."
                        rows="3"
                    ></textarea>
                    
                    <button class="interpret-button" onclick="interpretDream()">
                        ➤
                    </button>
                </div>
                
                <!-- Voice Button -->
                <div class="voice-section">
                    <button class="voice-button" onclick="startVoiceRecording()">
                        🎤 Use voice
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <a href="{{ url_for('dreams_history') }}" class="action-link">
                📚 I Tuoi Sogni
            </a>
            <a href="{{ url_for('profile') }}" class="action-link">
                📊 Statistiche
            </a>
        </div>
    </div>
</div>

<!-- Voice Recording Modal -->
<div id="voiceModal" class="voice-modal hidden">
    <div class="voice-modal-content">
        <div class="voice-modal-header">
            <h3>🎤 Registrazione Vocale</h3>
            <button class="voice-modal-close" onclick="closeVoiceModal()">×</button>
        </div>
        <div class="voice-modal-body">
            <div class="voice-indicator">
                <div class="voice-circle" id="voiceCircle"></div>
                <p id="voiceStatus">Clicca per iniziare a registrare</p>
            </div>
            <div class="voice-controls">
                <button id="recordBtn" class="voice-control-btn" onclick="toggleRecording()">
                    🎤 Registra
                </button>
                <button id="stopBtn" class="voice-control-btn hidden" onclick="stopRecording()">
                    ⏹️ Stop
                </button>
            </div>
        </div>
    </div>
</div>

<style>
/* Base Styles */
body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
}

.page-container {
    background: #000;
    min-height: 100vh;
    width: 100vw;
    max-width: 100vw;
    margin: 0;
    padding: 0;
    position: relative;
    color: white;
    overflow-x: hidden;
}

.main-content {
    padding: 0 20px 40px;
    width: 100%;
    max-width: 100%;
}

/* Hero Section */
.hero-section {
    padding: 30px 0 50px;
    text-align: left;
}

.hero-title {
    font-size: min(12vw, 54px);
    font-weight: 700;
    line-height: 1.0;
    margin: 0;
    color: white;
    word-spacing: 0.1em;
}

.gradient-text {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Input Section */
.input-section {
    margin-bottom: 30px;
}

.input-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
}

.input-header {
    margin-bottom: 16px;
}

.input-label {
    color: #888;
    font-size: 16px;
    margin: 0;
}

/* Text Input */
.text-input-container {
    position: relative;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 8px;
}

.mood-selector {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
}

.mood-button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.mood-button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(0, 122, 255, 0.3);
    transform: scale(1.05);
}

.mood-button.selected {
    background: rgba(0, 122, 255, 0.2);
    border-color: #007AFF;
}

.dream-input {
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 12px;
    padding: 16px 60px 16px 16px;
    color: white;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    transition: all 0.3s ease;
    box-sizing: border-box;
    min-height: 80px;
}

.dream-input:focus {
    outline: none;
    background: rgba(255,255,255,0.05);
}

.text-input-container:focus-within {
    border-color: #007AFF;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.dream-input::placeholder {
    color: #666;
}

.interpret-button {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
    border: none;
    border-radius: 12px;
    width: 44px;
    height: 44px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px rgba(0, 122, 255, 0.3);
    z-index: 10;
}

.interpret-button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 20px rgba(0, 122, 255, 0.5);
    background: linear-gradient(135deg, #0056CC 0%, #4942B8 100%);
}

.interpret-button:active {
    transform: scale(0.98);
}

/* Voice Section */
.voice-section {
    text-align: center;
}

.voice-button {
    background: linear-gradient(135deg, #FF9500 0%, #FF6B35 100%);
    border: none;
    color: white;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.voice-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 149, 0, 0.4);
}

/* Quick Actions */
.quick-actions {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 30px;
}

.action-link {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    text-decoration: none;
    color: white;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.3s ease;
    display: block;
}

.action-link:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(0, 122, 255, 0.3);
    transform: translateY(-2px);
    text-decoration: none;
    color: white;
}

/* Voice Modal */
.voice-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    padding: 20px;
}

.voice-modal.hidden {
    display: none;
}

.voice-modal-content {
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
    max-width: 350px;
    width: 100%;
    text-align: center;
}

.voice-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.voice-modal-header h3 {
    margin: 0;
    color: white;
    font-size: 18px;
}

.voice-modal-close {
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.voice-indicator {
    margin-bottom: 24px;
}

.voice-circle {
    width: 80px;
    height: 80px;
    border: 3px solid #FF6B35;
    border-radius: 50%;
    margin: 0 auto 12px;
    position: relative;
    transition: all 0.3s ease;
}

.voice-circle.recording {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.voice-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
}

.voice-control-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.voice-control-btn:hover {
    background: rgba(255,255,255,0.2);
}

.voice-control-btn.hidden {
    display: none;
}

/* Mobile adjustments */
@media (max-width: 375px) {
    .main-content {
        padding: 0 16px 40px;
    }
    
    .hero-title {
        font-size: min(11vw, 44px);
    }
    
    .mood-selector {
        flex-wrap: wrap;
        gap: 6px;
        justify-content: space-between;
    }
    
    .mood-button {
        width: 42px;
        height: 42px;
        font-size: 22px;
    }
    
    .quick-actions {
        flex-direction: column;
        gap: 12px;
    }
}

/* Desktop and larger screens - keep full width */
@media (min-width: 768px) {
    .page-container {
        max-width: 100vw;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
    }
    
    .main-content {
        max-width: 420px;
        margin: 0 auto;
        padding: 0 30px 50px;
    }
}
</style>

<script>
let selectedMood = 'neutro';
let isRecording = false;
let mediaRecorder;
let audioChunks = [];

// Mood selection
document.querySelectorAll('.mood-button').forEach(button => {
    button.addEventListener('click', function() {
        // Remove selected class from all buttons
        document.querySelectorAll('.mood-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        
        // Add selected class to clicked button
        this.classList.add('selected');
        selectedMood = this.getAttribute('data-mood');
    });
});

// Set default mood
document.querySelector('[data-mood="neutro"]').classList.add('selected');

// Interpret dream function
function interpretDream() {
    const dreamText = document.getElementById('dreamInput').value.trim();
    const button = document.querySelector('.interpret-button');
    
    if (!dreamText) {
        alert('Per favore, inserisci il tuo sogno prima di procedere.');
        return;
    }
    
    if (dreamText.length < 10) {
        alert('Per favore, descrivi il tuo sogno in modo più dettagliato.');
        return;
    }
    
    // Show loading state
    button.innerHTML = '⏳';
    button.disabled = true;
    button.style.opacity = '0.7';
    
    // Create form data
    const formData = {
        title: `Dream - ${new Date().toLocaleDateString('it-IT')}`,
        content: dreamText,
        mood: selectedMood,
        interpretation_style: 'psicologico'
    };
    
    // Submit to interpret endpoint
    fetch('/interpret', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Show success state briefly
            button.innerHTML = '✓';
            button.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
            
            // Redirect to the dreams history page to see the new interpretation
            setTimeout(() => {
                window.location.href = '/dreams_history';
            }, 1000);
        } else {
            // Reset button state
            button.innerHTML = '➤';
            button.disabled = false;
            button.style.opacity = '1';
            alert('Errore durante l\'interpretazione: ' + (data.error || 'Errore sconosciuto'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        // Reset button state
        button.innerHTML = '➤';
        button.disabled = false;
        button.style.opacity = '1';
        alert('Errore di connessione. Riprova.');
    });
}

// Voice recording functions
function startVoiceRecording() {
    document.getElementById('voiceModal').classList.remove('hidden');
}

function closeVoiceModal() {
    if (isRecording) {
        stopRecording();
    }
    document.getElementById('voiceModal').classList.add('hidden');
}

async function toggleRecording() {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                await processVoiceRecording(audioBlob);
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('recordBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
            document.getElementById('voiceCircle').classList.add('recording');
            document.getElementById('voiceStatus').textContent = 'Registrazione in corso...';
            
        } catch (error) {
            console.error('Error accessing microphone:', error);
            alert('Impossibile accedere al microfono. Controlla i permessi.');
        }
    }
}

function stopRecording() {
    if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        isRecording = false;
        
        // Stop all tracks
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        
        document.getElementById('recordBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
        document.getElementById('voiceCircle').classList.remove('recording');
        document.getElementById('voiceStatus').textContent = 'Elaborazione...';
    }
}

async function processVoiceRecording(audioBlob) {
    try {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'dream_recording.wav');
        formData.append('mood', selectedMood);
        
        const response = await fetch('/voice-interpret', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            closeVoiceModal();
            window.location.href = '/dreams_history';
        } else {
            alert('Errore durante l\'elaborazione: ' + (data.error || 'Errore sconosciuto'));
            document.getElementById('voiceStatus').textContent = 'Errore. Riprova.';
        }
    } catch (error) {
        console.error('Error processing voice recording:', error);
        alert('Errore durante l\'elaborazione della registrazione.');
        document.getElementById('voiceStatus').textContent = 'Errore. Riprova.';
    }
}

// Auto-resize textarea
document.getElementById('dreamInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Handle enter key
document.getElementById('dreamInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        interpretDream();
    }
});
</script>

</body>
</html>
