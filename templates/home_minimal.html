<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Home - Interprete dei Sogni</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='minimal.css') }}">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Interpreta i tuoi sogni con analisi psicologica avanzata">
    <style>
    body, html {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    
    /* Hide navbar for immersive experience */
    .navbar {
        display: none;
    }
    
    /* Full screen home */
    .dreamy-home {
        margin: 0;
        padding: 0;
    }
    
    /* Mobile menu toggle for this page only */
    .home-menu-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 2000;
        background: rgba(var(--surface-rgb), 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .home-menu-toggle:hover {
        background: rgba(var(--primary-rgb), 0.1);
        transform: scale(1.05);
    }
    
    /* Navigation for home page */
    .home-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(var(--surface-rgb), 0.98);
        backdrop-filter: blur(20px);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1999;
    }
    
    .home-nav.open {
        display: flex;
    }
    
    .home-nav-link {
        padding: 1.5rem 2rem;
        margin: 0.5rem 0;
        font-size: 1.3rem;
        color: var(--text);
        text-decoration: none;
        border-radius: var(--radius);
        background: rgba(var(--primary-rgb), 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        min-width: 200px;
        text-align: center;
        transform: translateY(20px);
        opacity: 0;
        animation: menuItemSlideIn 0.5s ease-out forwards;
    }
    
    .home-nav-link:nth-child(1) { animation-delay: 0.1s; }
    .home-nav-link:nth-child(2) { animation-delay: 0.2s; }
    .home-nav-link:nth-child(3) { animation-delay: 0.3s; }
    .home-nav-link:nth-child(4) { animation-delay: 0.4s; }
    
    .home-nav-link:hover {
        background: rgba(var(--primary-rgb), 0.2);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
    }
    
    .home-nav-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text);
        font-size: 2rem;
        cursor: pointer;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.3s ease;
    }
    
    .home-nav-close:hover {
        background: rgba(var(--danger), 0.1);
        color: var(--danger);
    }
    </style>
</head>
<body>
    <!-- Home Navigation Toggle -->
    <button class="home-menu-toggle" onclick="toggleHomeNav()" aria-label="Apri menu">
        ☰
    </button>
    
    <!-- Full Screen Navigation -->
    <nav class="home-nav" id="homeNav">
        <button class="home-nav-close" onclick="toggleHomeNav()" aria-label="Chiudi menu">
            ×
        </button>
        <a href="{{ url_for('interpret') }}" class="home-nav-link">✨ New Dream</a>
        <a href="{{ url_for('profile') }}" class="home-nav-link">👤 Profile</a>
        <a href="{{ url_for('settings') }}" class="home-nav-link">⚙️ Settings</a>
    </nav>

    <!-- Dreamy Home Content -->
    <div class="dreamy-home">
        <!-- Floating Dream Circles -->
        <div class="dreamy-circles">
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
        </div>
        
        <!-- Main Content -->
        <div class="home-content">
            <h1 class="modern-title">
                What did<br>
                you <span class="dream-highlight">dream</span><br>
                about..
            </h1>
            
            <!-- Fluid Waves Animation -->
            <div class="fluid-waves">
                <div class="wave wave-1"></div>
                <div class="wave wave-2"></div>
                <div class="wave wave-3"></div>
            </div>
            
            <!-- Voice Recording Button (Main) -->
            <div class="voice-record-container">
                <button onclick="startVoiceRecording()" class="voice-record-btn" aria-label="Tocca per registrare">
                    <div class="voice-icon">🎤</div>
                </button>
                <p class="tap-text">TAP TO RECORD</p>
            </div>
            
            <!-- Text Button (Secondary) -->
            <button onclick="window.location.href='{{ url_for('interpret') }}'" class="use-text-btn">
                Use text
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Home navigation toggle
        function toggleHomeNav() {
            const nav = document.getElementById('homeNav');
            nav.classList.toggle('open');
        }

        // Close nav when clicking on a link
        document.querySelectorAll('.home-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('homeNav').classList.remove('open');
            });
        });

        // Toast notification system - DISABLED
        function showToast(message, type = 'info', duration = 3000) {
            // Notifications disabled as requested
            return;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                window.location.href = '{{ url_for("interpret") }}';
            }
            if (e.key === 'Escape') {
                document.getElementById('homeNav').classList.remove('open');
            }
        });
        
        // Voice Recording System
        let recognition = null;
        let isRecording = false;
        let recordingTimeout = null;
        let finalTranscript = '';

        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return false;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'it-IT';
            recognition.maxAlternatives = 1;
            
            recognition.onstart = function() {
                isRecording = true;
                updateRecordingButton(true);
                showVoiceModal();
            };
            
            recognition.onresult = function(event) {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                updateVoiceModalText(finalTranscript + interimTranscript);
                
                // Reset timeout on speech detection
                if (recordingTimeout) {
                    clearTimeout(recordingTimeout);
                }
                recordingTimeout = setTimeout(stopVoiceRecording, 3000);
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    // Continue listening for speech
                    return;
                }
                stopVoiceRecording();
            };
            
            recognition.onend = function() {
                if (isRecording) {
                    // Restart recognition if we're still supposed to be recording
                    recognition.start();
                }
            };
            
            return true;
        }

        function startVoiceRecording() {
            if (!recognition && !initSpeechRecognition()) {
                alert('Voice recognition is not supported in this browser. Use Chrome or Edge.');
                return;
            }
            
            if (isRecording) {
                stopVoiceRecording();
                return;
            }
            
            finalTranscript = '';
            recognition.start();
            
            // Timeout after 30 seconds
            recordingTimeout = setTimeout(stopVoiceRecording, 30000);
        }

        function stopVoiceRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            if (recognition) {
                recognition.stop();
            }
            if (recordingTimeout) {
                clearTimeout(recordingTimeout);
            }
            
            updateRecordingButton(false);
            
            if (finalTranscript.trim()) {
                // Send to interpretation
                submitVoiceDream(finalTranscript.trim());
            } else {
                hideVoiceModal();
            }
        }

        function updateRecordingButton(recording) {
            const button = document.querySelector('.voice-record-btn');
            const icon = document.querySelector('.voice-icon');
            const text = document.querySelector('.tap-text');
            if (recording) {
                button.classList.add('recording');
                icon.innerHTML = '🔴';
                text.innerHTML = 'RECORDING...';
            } else {
                button.classList.remove('recording');
                icon.innerHTML = '🎤';
                text.innerHTML = 'TAP TO RECORD';
            }
        }

        function showVoiceModal() {
            const modal = document.createElement('div');
            modal.id = 'voiceModal';
            modal.className = 'voice-modal';
            modal.innerHTML = `
                <div class="voice-modal-content">
                    <div class="voice-modal-header">
                        <h3>🎤 Record your dream</h3>
                        <button class="voice-modal-close" onclick="stopVoiceRecording()">×</button>
                    </div>
                    <div class="voice-modal-body">
                        <div class="voice-indicator">
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                        </div>
                        <p class="voice-status">Listening... Speak naturally</p>
                        <div class="voice-transcript" id="voiceTranscript">
                            <em>Start telling your dream...</em>
                        </div>
                    </div>
                    <div class="voice-modal-footer">
                        <button class="btn btn-danger" onclick="stopVoiceRecording()">
                            🔴 Stop Recording
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function updateVoiceModalText(text) {
            const transcript = document.getElementById('voiceTranscript');
            if (transcript) {
                transcript.innerHTML = text || '<em>Keep talking...</em>';
            }
        }

        function hideVoiceModal() {
            const modal = document.getElementById('voiceModal');
            if (modal) {
                modal.remove();
            }
        }

        function submitVoiceDream(transcript) {
            hideVoiceModal();
            
            // Create form and submit
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '{{ url_for("voice_interpret") }}';
            
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'voice_transcript';
            input.value = transcript;
            
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initSpeechRecognition();
        });
    </script>
</body>
</html>
