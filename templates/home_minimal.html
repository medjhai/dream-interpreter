<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Home - Interprete dei Sogni</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='minimal.css') }}">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Interpreta i tuoi sogni con analisi psicologica avanzata">
    <style>
    body, html {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    
    /* Hide navbar for immersive experience */
    .navbar {
        display: none;
    }
    
    /* Full screen home */
    .dreamy-home {
        margin: 0;
        padding: 0;
    }
    
    /* Mobile menu toggle for this page only */
    .home-menu-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 2000;
        background: rgba(var(--surface-rgb), 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .home-menu-toggle:hover {
        background: rgba(var(--primary-rgb), 0.1);
        transform: scale(1.05);
    }
    
    /* Navigation for home page */
    .home-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(var(--surface-rgb), 0.98);
        backdrop-filter: blur(20px);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1999;
    }
    
    .home-nav.open {
        display: flex;
    }
    
    .home-nav-link {
        padding: 1.5rem 2rem;
        margin: 0.5rem 0;
        font-size: 1.3rem;
        color: var(--text);
        text-decoration: none;
        border-radius: var(--radius);
        background: rgba(var(--primary-rgb), 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        min-width: 200px;
        text-align: center;
        transform: translateY(20px);
        opacity: 0;
        animation: menuItemSlideIn 0.5s ease-out forwards;
    }
    
    .home-nav-link:nth-child(1) { animation-delay: 0.1s; }
    .home-nav-link:nth-child(2) { animation-delay: 0.2s; }
    .home-nav-link:nth-child(3) { animation-delay: 0.3s; }
    .home-nav-link:nth-child(4) { animation-delay: 0.4s; }
    
    .home-nav-link:hover {
        background: rgba(var(--primary-rgb), 0.2);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
    }
    
    .home-nav-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text);
        font-size: 2rem;
        cursor: pointer;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.3s ease;
    }
    
    .home-nav-close:hover {
        background: rgba(var(--danger), 0.1);
        color: var(--danger);
    }
    
    /* Content Layout */
    .content-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }
    
    @media (min-width: 1024px) {
        .content-layout {
            flex-direction: row;
            align-items: flex-start;
            gap: 4rem;
            padding: 4rem 2rem;
        }
        
        .content-left {
            flex: 1;
            max-width: 60%;
        }
        
        .content-right {
            flex: 0 0 auto;
            min-width: 320px;
        }
        
        .modern-title {
            font-size: 5rem !important;
            line-height: 1.1 !important;
            text-align: left !important;
        }
    }
    
    /* Dream Input Sections */
    .dream-input-section {
        margin-bottom: 2rem;
        width: 100%;
        max-width: 400px;
    }
    
    .section-header h3 {
        color: rgba(255,255,255,0.9);
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 1rem;
        text-align: center;
    }
    
    .text-input-container {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
    }
    
    .interpret-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .interpret-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
    }
    
    .btn-icon {
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
    }
    
    .voice-input-container {
        text-align: center;
        padding: 2rem 0;
    }
    
    .voice-record-btn {
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        padding: 1rem 2rem;
        color: rgba(255,255,255,0.9);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .voice-record-btn:hover {
        background: rgba(255,255,255,0.15);
        border-color: rgba(255,255,255,0.3);
    }
    
    .voice-record-btn.recording {
        background: rgba(220, 38, 38, 0.2);
        border-color: rgba(220, 38, 38, 0.4);
        animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    
    /* Unified Action Button Style */
    .action-btn {
        flex: 1;
        min-height: 120px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 20px;
        color: var(--text);
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(15px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
    }
    
    .action-btn:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.15);
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }
    
    .action-btn:active {
        transform: translateY(-2px);
    }
    
    .action-btn .btn-icon {
        font-size: 2.5rem;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        margin-bottom: 0.5rem;
    }
    
    .action-btn .btn-text {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: var(--text);
        margin-bottom: 0.25rem;
        text-align: center;
    }
    
    .action-btn .btn-subtitle {
        font-size: 0.9rem;
        opacity: 0.8;
        color: var(--text-light);
        font-weight: 500;
        text-align: center;
    }
    
    /* Voice Button Specific Styling */
    .action-btn-voice {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
        border-color: rgba(102, 126, 234, 0.3);
    }
    
    .action-btn-voice:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
        border-color: rgba(102, 126, 234, 0.5);
    }
    
    .action-btn-voice.recording {
        animation: pulse 1.5s infinite;
        background: linear-gradient(135deg, rgba(231, 76, 60, 0.3), rgba(192, 57, 43, 0.3));
        border-color: rgba(231, 76, 60, 0.5);
    }
    
    /* Text Button Specific Styling */
    .action-btn-text {
        background: linear-gradient(135deg, rgba(46, 204, 113, 0.2), rgba(39, 174, 96, 0.2));
        border-color: rgba(46, 204, 113, 0.3);
    }
    
    .action-btn-text:hover {
        background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.3));
        border-color: rgba(46, 204, 113, 0.5);
    }
    
    @media (max-width: 639px) {
        .action-btn {
            min-height: 100px;
            padding: 1.25rem;
        }
        
        .action-btn .btn-icon {
            font-size: 2rem;
        }
        
        .action-btn .btn-text {
            font-size: 1.1rem;
        }
        
        .action-btn .btn-subtitle {
            font-size: 0.85rem;
        }
    }
    </style>
</head>
<body>
    <!-- Home Navigation Toggle -->
    <button class="home-menu-toggle" onclick="toggleHomeNav()" aria-label="Apri menu">
        ☰
    </button>
    
    <!-- Full Screen Navigation -->
    <nav class="home-nav" id="homeNav">
        <button class="home-nav-close" onclick="toggleHomeNav()" aria-label="Chiudi menu">
            ×
        </button>
        <a href="{{ url_for('interpret') }}" class="home-nav-link">✨ New Dream</a>
        <a href="{{ url_for('profile') }}" class="home-nav-link">👤 Profile</a>
        <a href="{{ url_for('settings') }}" class="home-nav-link">⚙️ Settings</a>
    </nav>

    <!-- Dreamy Home Content -->
    <div class="dreamy-home">
        <!-- Floating Dream Circles -->
        <div class="dreamy-circles">
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
            <div class="dream-circle"></div>
        </div>
        
        <!-- Main Content -->
        <div class="home-content">
            <div class="content-layout">
                <!-- Left side: Title and waves -->
                <div class="content-left">
                    <h1 class="modern-title">
                        What did<br>
                        you <span class="dream-highlight">dream</span><br>
                        about..
                    </h1>
                    
                    <!-- Fluid Waves Animation -->
                    <div class="fluid-waves">
                        <div class="wave wave-1"></div>
                        <div class="wave wave-2"></div>
                        <div class="wave wave-3"></div>
                    </div>
                </div>
                
                <!-- Right side: Dream Input Options -->
                <div class="content-right">
                    <!-- Text Input Section -->
                    <div class="dream-input-section">
                        <div class="section-header">
                            <h3>✍️ Write about your dream here!</h3>
                        </div>
                        <div class="text-input-container">
                            <textarea id="dreamTextInput" placeholder="I dream that I am..." 
                                    style="width: 100%; min-height: 120px; padding: 1rem; 
                                           background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
                                           border-radius: 12px; color: var(--text); resize: vertical; 
                                           font-size: 1rem; line-height: 1.5;"></textarea>
                            <button onclick="interpretTextDream()" class="interpret-btn">
                                <span class="btn-icon">➤</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Voice Input Section -->
                    <div class="dream-input-section">
                        <div class="voice-input-container">
                            <button onclick="toggleVoiceRecording()" id="voiceBtn" class="voice-record-btn">
                                <span class="voice-icon">🎤</span>
                                <span class="voice-text">Use voice</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Home navigation toggle
        function toggleHomeNav() {
            const nav = document.getElementById('homeNav');
            nav.classList.toggle('open');
        }

        // Close nav when clicking on a link
        document.querySelectorAll('.home-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('homeNav').classList.remove('open');
            });
        });

        // Toast notification system - DISABLED
        function showToast(message, type = 'info', duration = 3000) {
            // Notifications disabled as requested
            return;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                window.location.href = '{{ url_for("interpret") }}';
            }
            if (e.key === 'Escape') {
                document.getElementById('homeNav').classList.remove('open');
            }
        });
        
        // Simplified Voice Recording System
        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';

        function toggleVoiceRecording() {
            if (isRecording) {
                stopVoiceRecording();
            } else {
                startVoiceRecording();
            }
        }

        function startVoiceRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Il tuo browser non supporta la registrazione vocale. Usa Chrome o Edge.');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'it-IT';
            
            recognition.onstart = function() {
                isRecording = true;
                updateVoiceButton(true);
            };
            
            recognition.onresult = function(event) {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                updateVoiceModalText(finalTranscript + interimTranscript);
                
                // Reset timeout on speech detection
                if (recordingTimeout) {
                    clearTimeout(recordingTimeout);
                }
                // Give more time for pauses in speech
                recordingTimeout = setTimeout(stopVoiceRecording, 5000);
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    // Continue listening for speech
                    return;
                } else if (event.error === 'aborted') {
                    // User stopped recording, don't show error
                    return;
                } else if (event.error === 'not-allowed') {
                    alert('Accesso al microfono negato. Per favore consenti l\'accesso al microfono.');
                } else if (event.error === 'network') {
                    alert('Errore di connessione. Controlla la tua connessione internet e riprova.');
                }
                stopVoiceRecording();
            };
            
            recognition.onend = function() {
                if (isRecording) {
                    // Restart recognition if we're still supposed to be recording
                    recognition.start();
                }
            };
            
            return true;
        }

        function startVoiceRecording() {
            if (!recognition && !initSpeechRecognition()) {
                alert('Voice recognition is not supported in this browser. Please use Chrome, Edge, or Safari.');
                return;
            }
            
            // Check if already recording
            if (isRecording) {
                stopVoiceRecording();
                return;
            }
            
            // Check microphone permission
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(() => {
                    // Permission granted, start recognition
                    actuallyStartRecording();
                })
                .catch(() => {
                    alert('Microphone access is required. Please allow microphone permission and try again.');
                });
        }

        function actuallyStartRecording() {
            if (isRecording) {
                return;
            }
            
            finalTranscript = '';
            try {
                recognition.start();
                
                // Timeout after 30 seconds
                recordingTimeout = setTimeout(stopVoiceRecording, 30000);
            } catch(e) {
                console.error('Recognition start error:', e);
                alert('Unable to start voice recognition. Please try again.');
            }
        }

        function stopVoiceRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            if (recognition) {
                recognition.stop();
            }
            if (recordingTimeout) {
                clearTimeout(recordingTimeout);
            }
            
            updateRecordingButton(false);
            
            if (finalTranscript.trim()) {
                // Show mood and style selection instead of immediate submission
                hideVoiceModal();
                showMoodStyleModal(finalTranscript.trim());
            } else {
                hideVoiceModal();
                alert('Nessun testo registrato. Riprova.');
            }
        }

        function updateRecordingButton(recording) {
            const button = document.querySelector('.action-btn-voice');
            const icon = button?.querySelector('.btn-icon');
            const subtitle = button?.querySelector('.btn-subtitle');
            if (recording) {
                button?.classList.add('recording');
                if (icon) icon.innerHTML = '🔴';
                if (subtitle) subtitle.innerHTML = 'Recording...';
            } else {
                button?.classList.remove('recording');
                if (icon) icon.innerHTML = '🎤';
                if (subtitle) subtitle.innerHTML = 'Speak naturally';
            }
        }

        function showVoiceModal() {
            const modal = document.createElement('div');
            modal.id = 'voiceModal';
            modal.className = 'voice-modal';
            modal.innerHTML = `
                <div class="voice-modal-content">
                    <div class="voice-modal-header">
                        <h3>🎤 Record your dream</h3>
                        <button class="voice-modal-close" onclick="stopVoiceRecording()">×</button>
                    </div>
                    <div class="voice-modal-body">
                        <div class="voice-indicator">
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                        </div>
                        <p class="voice-status">Listening... Speak naturally</p>
                        <div class="voice-transcript" id="voiceTranscript">
                            <em>Start telling your dream...</em>
                        </div>
                    </div>
                    <div class="voice-modal-footer">
                        <button class="btn btn-danger" onclick="stopVoiceRecording()">
                            🔴 Stop Recording
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function updateVoiceModalText(text) {
            const transcript = document.getElementById('voiceTranscript');
            if (transcript) {
                transcript.innerHTML = text || '<em>Keep talking...</em>';
            }
        }

        function hideVoiceModal() {
            const modal = document.getElementById('voiceModal');
            if (modal) {
                modal.remove();
            }
        }

        function showMoodStyleModal(transcript) {
            const modal = document.createElement('div');
            modal.id = 'moodStyleModal';
            modal.className = 'voice-modal';
            modal.innerHTML = `
                <div class="voice-modal-content" style="max-width: 500px; max-height: 80vh; overflow-y: auto;">
                    <div class="voice-modal-header">
                        <h3>🎭 Personalizza Interpretazione</h3>
                        <button class="voice-modal-close" onclick="closeMoodStyleModal()">×</button>
                    </div>
                    <div class="voice-modal-body">
                        <div style="background: var(--surface-light); padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
                            <h4 style="margin-bottom: 0.5rem;">📝 Trascrizione:</h4>
                            <p style="font-style: italic; line-height: 1.6;">${transcript}</p>
                        </div>
                        
                        <div style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Come ti sei sentito nel sogno?</label>
                            <select id="voiceMood" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);">
                                <option value="neutro">😐 Neutro</option>
                                <option value="felice">😊 Felice</option>
                                <option value="triste">😢 Triste</option>
                                <option value="ansioso">😰 Ansioso</option>
                                <option value="rabbioso">😠 Rabbioso</option>
                                <option value="confuso">😕 Confuso</option>
                            </select>
                        </div>
                        
                        <div style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Stile di interpretazione:</label>
                            <select id="voiceStyle" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);">
                                <option value="psicologico">🔍 Psicologico</option>
                                <option value="spirituale">🕉️ Spirituale</option>
                                <option value="neutro">📖 Neutro</option>
                            </select>
                        </div>
                        
                        <div style="text-align: center;">
                            <button onclick="submitVoiceDreamWithParams('${transcript.replace(/'/g, "\\\'")}')" style="background: var(--primary); color: white; border: none; padding: 0.75rem 2rem; border-radius: var(--radius); font-size: 1rem; cursor: pointer; margin-right: 1rem;">
                                🔮 Interpreta Sogno
                            </button>
                            <button onclick="closeMoodStyleModal()" style="background: var(--surface-light); color: var(--text); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: var(--radius); font-size: 1rem; cursor: pointer;">
                                Annulla
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeMoodStyleModal() {
            const modal = document.getElementById('moodStyleModal');
            if (modal) {
                modal.remove();
            }
        }

        function submitVoiceDreamWithParams(transcript) {
            const mood = document.getElementById('voiceMood')?.value || 'neutro';
            const style = document.getElementById('voiceStyle')?.value || 'psicologico';
            
            closeMoodStyleModal();
            
            // Show loading state
            const loadingDiv = document.createElement('div');
            loadingDiv.innerHTML = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                           background: rgba(0,0,0,0.8); z-index: 9999; display: flex; 
                           align-items: center; justify-content: center; color: white;">
                    <div style="text-align: center;">
                        <div style="font-size: 2rem; margin-bottom: 1rem;">🔮</div>
                        <div>Interpretando il tuo sogno...</div>
                    </div>
                </div>
            `;
            document.body.appendChild(loadingDiv);
            
            // Create form and submit
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '{{ url_for("interpret") }}';
            
            // Add form fields
            const titleInput = document.createElement('input');
            titleInput.type = 'hidden';
            titleInput.name = 'title';
            titleInput.value = `Sogno Vocale - ${new Date().toLocaleDateString('it-IT')}`;
            
            const contentInput = document.createElement('input');
            contentInput.type = 'hidden';
            contentInput.name = 'content';
            contentInput.value = transcript;
            
            const moodInput = document.createElement('input');
            moodInput.type = 'hidden';
            moodInput.name = 'mood';
            moodInput.value = mood;
            
            const styleInput = document.createElement('input');
            styleInput.type = 'hidden';
            styleInput.name = 'style';
            styleInput.value = style;
            
            form.appendChild(titleInput);
            form.appendChild(contentInput);
            form.appendChild(moodInput);
            form.appendChild(styleInput);
            
            document.body.appendChild(form);
            form.submit();
        }

        // Home navigation function
        function toggleHomeNav() {
            const nav = document.getElementById('homeNav');
            if (nav) {
                nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initSpeechRecognition();
        });
    </script>
</body>
</html>
